<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ADMISSION//26</title>
<style>
  @font-face { font-family: "Bebas"; src: url("fonts/BebasNeue-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Barlow"; src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "BarlowMed"; src: url("fonts/BarlowCondensed-Medium.ttf") format("truetype"); font-weight: 500; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #F1EFE9;
    overflow: hidden;
    color: #111111;
  }

  .sheet {
    position: relative;
    width: 1200px;
    height: 630px;
  }

  .marks {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 630px;
    pointer-events: none;
  }

  .plate {
    position: absolute;
    left: 48px;
    top: 40px;
    width: 1104px;
    height: 550px;
    border: 1.5px solid #111111;
    display: flex;
    flex-direction: column;
    background: #F1EFE9;
  }

  .head, .foot {
    height: 52px;
    flex: 0 0 52px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 22px;
    font-family: "BarlowMed", "Liberation Sans Narrow", sans-serif;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #777777;
  }
  .head { border-bottom: 1.5px solid #111111; }
  .foot { border-top: 1.5px solid #111111; }
  .head .end, .foot .end { justify-self: end; }
  .mark {
    width: 9px;
    height: 9px;
    background: #D71920;
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lockup { text-align: center; }

  .name {
    font-family: "Bebas", "Arial Narrow", sans-serif;
    font-size: 196px;
    line-height: 0.78;
    letter-spacing: 0.01em;
    color: #111111;
  }

  .year {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #D71920;
  }
  .year span {
    font-family: "Bebas", "Arial Narrow", sans-serif;
    font-size: 168px;
    line-height: 0.8;
    letter-spacing: 0.02em;
  }

  .rule {
    height: 8px;
    background: #D71920;
    margin: 18px auto 16px;
    width: 100%;
  }

  .tag {
    font-family: "Barlow", "Liberation Sans Narrow", sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.145em;
    line-height: 1;
    color: #111111;
    text-transform: uppercase;
  }

  .cells {
    display: contents;
  }
  .cell {
    font-family: "BarlowMed", "Liberation Sans Narrow", sans-serif;
    font-size: 16px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #111111;
  }
  .cell b {
    color: #D71920;
    font-weight: 500;
    margin-right: 8px;
  }
  .foot {
    grid-template-columns: 1fr 1fr 1fr;
    padding: 0;
  }
  .foot .cell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .foot .cell + .cell { border-left: 1.5px solid #111111; }
</style>
</head>
<body>
  <div class="sheet">
    <svg class="marks" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="#111111" stroke-width="1.5">
        <path d="M16 40 H48 M1152 40 H1184 M16 590 H48 M1152 590 H1184"/>
        <path d="M48 14 V40 M48 590 V616 M1152 14 V40 M1152 590 V616"/>
      </g>
    </svg>
    <div class="plate">
      <header class="head">
        <span>File no. ADM—26</span>
        <span class="mark" aria-hidden="true"></span>
        <span class="end">Dhaka · Bangladesh</span>
      </header>
      <div class="stage">
        <div class="lockup" id="lockup">
          <div class="name">ADMISSION</div>
          <div class="year">
            <svg width="78" height="118" viewBox="0 0 78 118" aria-hidden="true">
              <polygon points="30,2 20,116 4,116 14,2" fill="#D71920"/>
              <polygon points="70,2 60,116 44,116 54,2" fill="#D71920"/>
            </svg>
            <span>26</span>
          </div>
          <div class="rule"></div>
          <div class="tag">The Bangladesh University Admission Archive</div>
        </div>
      </div>
      <footer class="foot">
        <div class="cell"><b>01</b> Public record</div>
        <div class="cell"><b>02</b> University cycle</div>
        <div class="cell"><b>03</b> Sheet 01 / 01</div>
      </footer>
    </div>
  </div>
</body>
</html>
